<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LuxOud Perfumes</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>

body{
background:#0b0b0b;
}

.gold{
color:#d4af37;
}

.gold-bg{
background:#d4af37;
}

.modal{
display:none;
}

.modal.active{
display:flex;
}

  .whatsapp-container{
  position: fixed;
  bottom:20px;
  right:10px; /* 🔥 más pegado a la derecha */
  z-index:100;
}

/* BOTÓN */
.whatsapp-float{
  width:60px;
  height:60px;
  background:#25D366;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.4);
  animation: pulse 2s infinite;
}

/* NOTIFICACIÓN */
.whatsapp-noti{
  position:absolute;
  bottom:75px;
  right:30px; /* 🔥 más cerca del botón */
  background:#111;
  color:#fff;
  padding:8px 14px;
  border-radius:15px;
  font-size:13px;
  white-space: nowrap;
  box-shadow:0 5px 20px rgba(0,0,0,0.5);
  border:1px solid rgba(255,255,255,0.1);

  animation: fadeInUp 0.6s ease;
}

/* ANIMACIONES */
@keyframes pulse{
  0%{ transform: scale(1); }
  50%{ transform: scale(1.1); }
  100%{ transform: scale(1); }
}

@keyframes fadeInUp{
  from{
    opacity:0;
    transform: translateY(10px);
  }
  to{
    opacity:1;
    transform: translateY(0);
  }
}
  
</style>

</head>

<body class="text-white font-sans">

<div class="max-w-6xl mx-auto p-6">

<div class="text-center mb-10">

<div class="flex justify-center items-center py-8">
  <img 
    src="logo.png" 
    alt="LuxOud Perfume" 
    class="w-full max-w-3xl object-cover mx-auto scale-125"
  >
</div>

<input 
id="searchInput"
type="text"
placeholder="Buscar perfume..."
class="w-full md:w-96 bg-[#111] border border-[#333] rounded-lg p-3 text-white focus:outline-none focus:border-[#d4af37]"
>

</div>

<div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 gap-6"></div>

</div>


<div id="modal" class="modal fixed inset-0 bg-black bg-opacity-80 items-center justify-center p-4">

<div class="bg-[#111] rounded-xl max-w-md w-full p-6 relative border border-[#d4af37]">

<button onclick="closeModal()" class="absolute top-3 right-4 text-xl text-white">✕</button>

<img id="modalImage" class="rounded-lg mb-4 w-full h-64 object-contain bg-white">

<h2 id="modalName" class="text-2xl gold mb-1"></h2>

<p id="modalPrice" class="text-lg mb-2 font-semibold"></p>

<p id="modalDescription" class="text-gray-400 mb-4"></p>

<a id="whatsappBtn"
target="_blank"
class="block text-center gold-bg hover:opacity-90 text-black font-bold py-3 rounded-lg">
Pedir por WhatsApp
</a>

</div>

</div>

const grid=document.getElementById("productGrid");
const searchInput=document.getElementById("searchInput");
const modalImage = document.getElementById("modalImage");
const modalName = document.getElementById("modalName");
const modalPrice = document.getElementById("modalPrice");
const modalDescription = document.getElementById("modalDescription");
const whatsappBtn = document.getElementById("whatsappBtn");

function renderProducts(lista){

grid.innerHTML="";

lista.forEach(producto=>{

const card=document.createElement("div");

card.className="bg-[#111] rounded-xl overflow-hidden shadow-lg cursor-pointer hover:scale-105 transition border border-[#222]";

card.innerHTML=`

<img src="${producto.imagen}" class="w-full h-64 object-contain bg-white">

<div class="p-4">

<h3 class="font-semibold text-lg gold">${producto.nombre}</h3>

<p class="mt-1 text-white font-bold">${producto.precio}</p>

</div>

`;

card.onclick=()=>openModal(producto);

grid.appendChild(card);

});

}

renderProducts(productos);


searchInput.addEventListener("input",()=>{

const texto=searchInput.value.toLowerCase();

const filtrados=productos.filter(p =>
p.nombre.toLowerCase().includes(texto)
);

renderProducts(filtrados);

});


function openModal(producto){

document.getElementById("modal").classList.add("active");

document.getElementById("whatsappFloat").style.display = "none";

modalImage.src=producto.imagen;
modalName.innerText=producto.nombre;
modalPrice.innerText=producto.precio;
modalDescription.innerText=producto.descripcion;

const mensaje=`Hola, quiero comprar el perfume *${producto.nombre}* a *${producto.precio}*
¿Está disponible?`;

whatsappBtn.href=`https://wa.me/${phoneNumber}?text=${encodeURIComponent(mensaje)}`;

}

function closeModal(){

document.getElementById("modal").classList.remove("active");

}
function closeModal(){
  document.getElementById("modal").classList.remove("active");
  document.getElementById("whatsappFloat").style.display = "block";
}

// 👇 AQUÍ VA LO NUEVO
const noti = document.querySelector(".whatsapp-noti");

function toggleNoti() {
  noti.style.display = "block";

  setTimeout(() => {
    noti.style.display = "none";
  }, 5000);
}

setInterval(toggleNoti, 15000);
toggleNoti();
  
</script>
<!-- BOTÓN WHATSAPP FLOTANTE -->
<div class="whatsapp-container" id="whatsappFloat">
